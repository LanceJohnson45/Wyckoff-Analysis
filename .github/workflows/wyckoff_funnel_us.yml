name: Wyckoff Funnel US

on:
  schedule:
    # 美东 23:59 近似调度（GitHub Actions cron 仅支持 UTC，且不自动处理 DST）：
    # - 夏令时（大致 3-10 月）：UTC 03:59，对应美东前一交易日 23:59
    # - 冬令时（大致 11-2 月）：UTC 04:59，对应美东前一交易日 23:59
    # 由于 UTC 日期已进入次日，这里使用 Tue-Sat 触发来覆盖美东 Mon-Fri 晚间。
    - cron: "59 3 * 3-10 2-6"
    - cron: "59 4 * 11,12,1,2 2-6"
  workflow_dispatch:

concurrency:
  group: daily-job-us-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      FEISHU_WEBHOOK_URL: "https://open.feishu.cn/open-apis/bot/v2/hook/f8aa11e7-de81-464a-9041-db38ec5f2c30"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PG_ENABLED: ${{ secrets.PG_ENABLED }}
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_PORT: ${{ secrets.PG_PORT }}
      PG_DATABASE: ${{ secrets.PG_DATABASE }}
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
      PG_DSN: ${{ secrets.PG_DSN }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      DATA_SOURCE_DEBUG: "1"
      FUNNEL_MARKET: "us"
      FUNNEL_POOL_MODE: "sp500"
      FUNNEL_EXECUTOR_MODE: "thread"
      FUNNEL_MAX_WORKERS: "3"
      FUNNEL_BATCH_SIZE: "60"
      FUNNEL_FETCH_RETRIES: "2"
      FUNNEL_BATCH_TIMEOUT: "300"
      DAILY_JOB_SKIP_STEP4: "1"
      DAILY_JOB_REQUIRE_STEP3_REPORT: "1"
      FUNNEL_PREWARM_DAYS: "320"
      FUNNEL_PREWARM_TIMEOUT_MINUTES: "45"
      US_SP500_SYNC_BOOTSTRAP_DAYS: "360"
      US_SP500_BATCH_SIZE: "40"
      US_SP500_SLEEP_SECONDS: "0.5"
      SP500_SNAPSHOT_CACHE_KEY: us-sp500-snapshot-${{ github.ref_name }}-${{ github.run_id }}
      TZ: America/New_York

    steps:
      - uses: actions/checkout@v4

      - name: Restore S&P500 snapshot cache
        id: restore-sp500-snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/us_sp500_constituents.json
          key: ${{ env.SP500_SNAPSHOT_CACHE_KEY }}
          restore-keys: |
            us-sp500-snapshot-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          echo "::group::Install packages"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          echo "::endgroup::"

      - name: Prepare logs dir
        run: mkdir -p logs

      - name: Sync S&P500 constituents
        run: |
          echo "::group::Sync S&P 500 Constituents"
          python -u scripts/us_sp500_maintenance.py sync --bootstrap-new --bootstrap-trading-days ${US_SP500_SYNC_BOOTSTRAP_DAYS} --batch-size ${US_SP500_BATCH_SIZE} --sleep-seconds ${US_SP500_SLEEP_SECONDS} \
            2>&1 | tee -a ${{ github.workspace }}/logs/us_sp500_sync.console.log
          echo "::endgroup::"

      - name: Prewarm funnel cache
        timeout-minutes: 50
        run: |
          echo "::group::Prewarm cache (US)"
          set -o pipefail
          timeout "${FUNNEL_PREWARM_TIMEOUT_MINUTES}m" python -u scripts/funnel_prewarm.py --market us --trading-days ${FUNNEL_PREWARM_DAYS} \
            2>&1 | tee -a ${{ github.workspace }}/logs/funnel_prewarm_us.console.log
          echo "::endgroup::"

      - name: Run US daily job
        run: |
          echo "::group::Run daily job script (US)"
          python -u scripts/daily_job.py --logs ${{ github.workspace }}/logs/daily_job_us.log \
            2>&1 | tee -a ${{ github.workspace }}/logs/daily_job_us.console.log
          echo "::endgroup::"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-us-logs-${{ github.run_number }}
          path: logs/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Save S&P500 snapshot cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/us_sp500_constituents.json
          key: ${{ env.SP500_SNAPSHOT_CACHE_KEY }}

      - name: Notify on failure
        if: failure()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          REF: ${{ github.ref_name }}
        run: |
          python -c "
          import os, urllib.request, json
          url = os.environ.get('FEISHU_WEBHOOK_URL', '')
          if not url:
            print('FEISHU_WEBHOOK_URL 未配置，跳过失败通知')
            exit(0)
          content = '**Run**: ' + os.environ.get('RUN_URL', '') + '\n**Workflow**: ' + os.environ.get('WORKFLOW', '') + '\n**Branch**: ' + os.environ.get('REF', '')
          payload = {
            'msg_type': 'interactive',
            'card': {
              'header': {'title': {'tag': 'plain_text', 'content': '❌ US 定时任务失败'}},
              'elements': [{'tag': 'div', 'text': {'tag': 'lark_md', 'content': content}}]
            }
          }
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'})
          try:
            urllib.request.urlopen(req, timeout=10)
          except Exception as e:
            print('warning: 失败通知发送异常:', e)
          "
