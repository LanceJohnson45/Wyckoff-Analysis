name: US S&P500 Constituent Sync

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-data-us
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PG_ENABLED: "1"
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_PORT: ${{ secrets.PG_PORT }}
      PG_DATABASE: ${{ secrets.PG_DATABASE }}
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
      PG_DSN: ${{ secrets.PG_DSN }}
      US_SP500_SYNC_BOOTSTRAP_DAYS: "360"
      US_SP500_BATCH_SIZE: "40"
      US_SP500_SLEEP_SECONDS: "1.0"
      SP500_SNAPSHOT_CACHE_KEY: us-sp500-snapshot-${{ github.ref_name }}-${{ github.run_id }}
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v7

      - name: Restore S&P500 snapshot cache
        id: restore-sp500-snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/us_sp500_constituents.json
          key: ${{ env.SP500_SNAPSHOT_CACHE_KEY }}
          restore-keys: |
            us-sp500-snapshot-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen --no-dev

      - name: Sync constituents and bootstrap new names
        run: |
          set -o pipefail
          uv run --frozen --no-dev python -u scripts/us_sp500_maintenance.py sync --bootstrap-new --bootstrap-trading-days ${US_SP500_SYNC_BOOTSTRAP_DAYS} --batch-size ${US_SP500_BATCH_SIZE} --sleep-seconds ${US_SP500_SLEEP_SECONDS} \
            2>&1 | tee us_sp500_sync.log

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: us-sp500-sync-${{ github.run_number }}
          path: us_sp500_sync.log
          retention-days: 7
          if-no-files-found: warn

      - name: Save S&P500 snapshot cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/us_sp500_constituents.json
          key: ${{ env.SP500_SNAPSHOT_CACHE_KEY }}
