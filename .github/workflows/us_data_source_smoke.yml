name: US Data Source Smoke

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated US tickers"
        required: false
        default: "AAPL,MSFT,GM,EOG"
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: "2025-09-01"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: false
        default: "2025-09-10"

concurrency:
  group: us-data-source-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      FUNNEL_MARKET: "us"
      DATA_SOURCE_DEBUG: "1"
      TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
      PG_ENABLED: ${{ secrets.PG_ENABLED }}
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_PORT: ${{ secrets.PG_PORT }}
      PG_DATABASE: ${{ secrets.PG_DATABASE }}
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
      PG_DSN: ${{ secrets.PG_DSN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Prepare logs dir
        run: mkdir -p logs

      - name: Run smoke probe
        env:
          SMOKE_SYMBOLS: ${{ github.event.inputs.symbols }}
          SMOKE_START_DATE: ${{ github.event.inputs.start_date }}
          SMOKE_END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee -a "${{ github.workspace }}/logs/us_data_source_smoke.console.log"
from __future__ import annotations

import os
from datetime import datetime

from integrations.data_source import fetch_stock_hist
from integrations.postgres_base import connect_postgres, postgres_enabled


def log(msg: str) -> None:
    print(f"[{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}] {msg}", flush=True)


symbols = [
    s.strip().upper()
    for s in (os.getenv("SMOKE_SYMBOLS", "AAPL,MSFT,GM,EOG") or "").split(",")
    if s.strip()
]
start_date = os.getenv("SMOKE_START_DATE", "2025-09-01")
end_date = os.getenv("SMOKE_END_DATE", "2025-09-10")

log(
    "env "
    f"pg_enabled={postgres_enabled()} "
    f"pg_host_set={bool(os.getenv('PG_HOST', '').strip())} "
    f"tickflow_key_set={bool(os.getenv('TICKFLOW_API_KEY', '').strip())}"
)

if postgres_enabled():
    try:
        with connect_postgres() as conn:
            with conn.cursor() as cur:
                cur.execute("select current_database(), current_user, now()")
                row = cur.fetchone()
        log(f"postgres ok db={row[0]} user={row[1]} now={row[2]}")
    except Exception as e:
        log(f"postgres fail {type(e).__name__}: {e}")
else:
    log("postgres skipped because PG_ENABLED is false")

ok = 0
fail = 0
for symbol in symbols:
    try:
        df = fetch_stock_hist(symbol, start_date, end_date, adjust="qfq", market="us")
        src = df.attrs.get("source")
        first_date = None if df.empty else str(df.iloc[0]["日期"])
        last_date = None if df.empty else str(df.iloc[-1]["日期"])
        log(
            f"fetch ok {symbol} rows={len(df.index)} "
            f"source={src} first={first_date} last={last_date}"
        )
        ok += 1
    except Exception as e:
        log(f"fetch fail {symbol} {type(e).__name__}: {e}")
        fail += 1

if fail:
    raise SystemExit(1)
log(f"smoke done ok={ok} fail={fail}")
PY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-data-source-smoke-logs-${{ github.run_number }}
          path: logs/*
          retention-days: 7
          if-no-files-found: warn
