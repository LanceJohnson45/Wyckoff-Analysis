name: US Daily Bar Refresh

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional fixed completed US session; provide together with symbols"
        required: false
        type: string
      symbols:
        description: "Optional explicit research pool, comma separated; requires as_of"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: market-data-us
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PG_ENABLED: "1"
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_PORT: ${{ secrets.PG_PORT }}
      PG_DATABASE: ${{ secrets.PG_DATABASE }}
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
      PG_DSN: ${{ secrets.PG_DSN }}
      US_REFRESH_TRADING_DAYS: "7"
      US_SP500_BATCH_SIZE: "40"
      US_SP500_SLEEP_SECONDS: "0.5"
      SP500_SNAPSHOT_CACHE_KEY: us-sp500-snapshot-${{ github.ref_name }}-${{ github.run_id }}
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v7

      - name: Restore S&P500 snapshot cache
        id: restore-sp500-snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/us_sp500_constituents.json
          key: ${{ env.SP500_SNAPSHOT_CACHE_KEY }}
          restore-keys: |
            us-sp500-snapshot-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen --no-dev

      - name: Verify PostgreSQL target
        run: |
          uv run --frozen --no-dev python -c "from integrations.postgres_base import postgres_configured; raise SystemExit(0 if postgres_configured() else 'PG连接配置缺失')"

      - name: Refresh active S&P500 or explicit research pool
        env:
          INPUT_AS_OF: ${{ inputs.as_of }}
          INPUT_SYMBOLS: ${{ inputs.symbols }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_AS_OF" ] || [ -n "$INPUT_SYMBOLS" ]; then
            if [ -z "$INPUT_AS_OF" ] || [ -z "$INPUT_SYMBOLS" ]; then
              echo "as_of and symbols must be supplied together" | tee us_daily_bar_refresh.log
              exit 2
            fi
            uv run --frozen --no-dev python -u scripts/us_research_refresh.py --as-of "$INPUT_AS_OF" --symbols "$INPUT_SYMBOLS" \
              --batch-size "$US_SP500_BATCH_SIZE" --sleep-seconds "$US_SP500_SLEEP_SECONDS" \
              2>&1 | tee us_daily_bar_refresh.log
          else
            uv run --frozen --no-dev python -u scripts/us_sp500_maintenance.py refresh --trading-days "$US_REFRESH_TRADING_DAYS" \
              --batch-size "$US_SP500_BATCH_SIZE" --sleep-seconds "$US_SP500_SLEEP_SECONDS" \
              2>&1 | tee us_daily_bar_refresh.log
          fi

      - name: Upload refresh log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: us-daily-bar-refresh-${{ github.run_number }}
          path: us_daily_bar_refresh.log
          retention-days: 7
          if-no-files-found: warn

      - name: Save S&P500 snapshot cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/us_sp500_constituents.json
          key: ${{ env.SP500_SNAPSHOT_CACHE_KEY }}
