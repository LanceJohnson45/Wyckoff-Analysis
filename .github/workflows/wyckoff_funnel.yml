name: CN Daily Market Data

on:
  schedule:
    # 北京 18:00（UTC 10:00），A股收盘后，工作日周一至周五
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-job-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
      TIKFLOW_API_KEY: ${{ secrets.TIKFLOW_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PG_ENABLED: "1"
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_PORT: ${{ secrets.PG_PORT }}
      PG_DATABASE: ${{ secrets.PG_DATABASE }}
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
      PG_DSN: ${{ secrets.PG_DSN }}
      FUNNEL_PREWARM_DAYS: "320"
      # 60分钟停止派发、65分钟结束预热；70分钟仅作最后保护。
      FUNNEL_PREWARM_TIMEOUT_MINUTES: "70"
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          echo "::group::Install packages"
          python -m pip install uv==0.12.5
          uv sync --frozen --no-dev
          echo "::endgroup::"

      - name: Verify PostgreSQL target
        run: |
          uv run --frozen --no-dev python -c "from integrations.postgres_base import postgres_configured; raise SystemExit(0 if postgres_configured() else 'PG连接配置缺失，请配置同一本机同步使用的数据库；不会回退到Supabase')"

      - name: Prepare logs dir
        run: mkdir -p logs

      - name: Restore prewarm state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/funnel_prewarm_state.json
            data/yfinance_shares_cache.json
          key: funnel-prewarm-state-cn-${{ github.ref_name }}-${{ env.FUNNEL_PREWARM_DAYS }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            funnel-prewarm-state-cn-${{ github.ref_name }}-${{ env.FUNNEL_PREWARM_DAYS }}-

      - name: Fetch daily market data
        timeout-minutes: 75
        run: |
          echo "::group::Prewarm cache (CN)"
          set -o pipefail
          set +e
          timeout --kill-after=30s "${FUNNEL_PREWARM_TIMEOUT_MINUTES}m" uv run --frozen --no-dev python -u scripts/funnel_prewarm.py --market cn --universe all --trading-days ${FUNNEL_PREWARM_DAYS} \
            --symbol-timeout-seconds 60 \
            --dispatch-budget-seconds "$(( (FUNNEL_PREWARM_TIMEOUT_MINUTES - 10) * 60 ))" \
            --run-budget-seconds "$(( (FUNNEL_PREWARM_TIMEOUT_MINUTES - 5) * 60 ))" \
            2>&1 | tee -a ${{ github.workspace }}/logs/funnel_prewarm_cn.console.log
          prewarm_status=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"
          if [ "${prewarm_status}" -eq 124 ]; then
            echo "::error title=Prewarm timeout::CN prewarm exceeded ${FUNNEL_PREWARM_TIMEOUT_MINUTES} minutes; partial progress was checkpointed and a same-day rerun will resume it."
          elif [ "${prewarm_status}" -ne 0 ]; then
            echo "::error title=Prewarm failed::CN prewarm exited with code ${prewarm_status}."
          fi
          exit "${prewarm_status}"

      - name: Refresh analysis benchmark daily bars
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          uv run --frozen --no-dev python -u scripts/refresh_market_benchmarks.py --market cn \
            2>&1 | tee logs/benchmark_cn.console.log

      - name: Save prewarm state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/funnel_prewarm_state.json
            data/yfinance_shares_cache.json
          key: funnel-prewarm-state-cn-${{ github.ref_name }}-${{ env.FUNNEL_PREWARM_DAYS }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-logs-${{ github.run_number }}
          path: |
            logs/*.log
            logs/prewarm_*.csv
            logs/prewarm_*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          REF: ${{ github.ref_name }}
        run: |
          python -c "
          import os, urllib.request, json
          url = os.environ.get('FEISHU_WEBHOOK_URL', '')
          if not url:
            print('FEISHU_WEBHOOK_URL 未配置，跳过失败通知')
            exit(0)
          content = '**Run**: ' + os.environ.get('RUN_URL', '') + '\n**Workflow**: ' + os.environ.get('WORKFLOW', '') + '\n**Branch**: ' + os.environ.get('REF', '')
          payload = {
            'msg_type': 'interactive',
            'card': {
              'header': {'title': {'tag': 'plain_text', 'content': '❌ 定时任务失败'}},
              'elements': [{'tag': 'div', 'text': {'tag': 'lark_md', 'content': content}}]
            }
          }
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'})
          try:
            urllib.request.urlopen(req, timeout=10)
          except Exception as e:
            print('warning: 失败通知发送异常:', e)
          "
